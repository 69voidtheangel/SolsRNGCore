[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "solsrng-core"
version = "0.1.1"
description = "Sol's RNG Discord webhook + Anti-AFK GUI core"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["src"]
